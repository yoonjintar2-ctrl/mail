<p>Gmail을 넓은 창에서 더 편하게 쓰는 크롬 확장 프로그램이에요.</p>
<ul><li>나만의 편지함·하위 편지함 (Gmail 라벨은 그대로)</li><li>본문 전체 검색과 보낸사람·첨부·기간 필터</li><li>표·엑셀 붙여넣기, 서명, 호칭 추천 같은 작성 도구</li></ul>
<p>메일과 설정은 사용자의 PC와 Google 사이에서만 오가요. 별도 서버가 없어요.</p>
<p>설치는 팀에서 받은 크롬 웹스토어 링크로 해 주세요.</p>
